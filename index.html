<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Sign Up Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="bg-overlay">
        <div class="logo">
          <img src="images/odin-lined2.png" id="odin" />
          <h1 id="title">Odin</h1>
          <p class="background-credits">
            Photo by
            <a
              href="https://unsplash.com/@haliewestphoto"
              target="_blank"
              rel="noopener noreferrer"
              >Halie West</a
            >
            from
            <a
              href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
              target="_blank"
              rel="noopener noreferrer"
              >Unsplash</a
            >
          </p>
        </div>
      </div>
      <div class="form-fill">
        <div class="text-area">
          <h1>Create your account</h1>
          This is not a real online service!You know you eed something like this
          in your life to help you realize your deepest dreams. Sign up now to
          get started You know you want to.
        </div>
        <div class="form-area">
          <form>
            <fieldset>
              <legend>Lets Do this!</legend>

              <div class="row-1">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" />

                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last" />
              </div>

              <div class="row-2">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" />

                <label for="phone_number">Phone Number:</label>
                <input type="tel" id="phone_number" name="phone_number" />
              </div>

              <div class="row-3">
                <label for="password">Password</label>
                <input type="text" id="password" name="password" />

                <label for="c-password">Confirm Password</label>
                <input type="text" id="c-password" name="c-password" />
              </div>
            </fieldset>
          </form>
        </div>
        <button type="submit">Create Account</button>
        <p id="sign-in">Already have an account? <a href="#">Log in</a></p>
      </div>
    </div>
  </body>
</html>
