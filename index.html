<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Sign Up Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="bg-overlay">
        <div class="logo"></div>
      </div>
      <div class="form-fill">
        <div class="text-area">
          This is not a real online service!You know you eed something like this
          in your life to help you realize your deepest dreams. Sign up now to
          get started You know you want to.
        </div>
        <div class="form-area">
          <form>
            <fieldset>
              <legend>Lets Do this!</legend>

              <label for="name">Name:</label>
              <input type="text" id="name" name="name" />

              <label for="last-name">Last Name:</label>
              <input type="text" id="last-name" name="last" />

              <label for="email">Email:</label>
              <input type="email" id="email" name="email" />

              <label for="phone_number">Phone Number:</label>
              <input type="tel" id="phone_number" name="phone_number" />

              <label for="password">Password</label>
              <input type="text" id="password" name="password" />

              <label for="c-password">Confirm Password</label>
              <input type="text" id="c-password" name="c-password" />
            </fieldset>
          </form>
        </div>
        <div class="button-area">
          <button type="submit">Create Account</button>
          <p>Already have an account?</p>
          <a href="#">Log in</a>
        </div>
      </div>
    </div>
  </body>
</html>
