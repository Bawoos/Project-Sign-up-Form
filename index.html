<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Sign Up Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="bg-overlay">
        <div class="logo">
          <img src="images/odin-lined2.png" id="odin" />
          <h1 id="title">Odin</h1>
          <p class="background-credits">
            Photo by
            <a
              href="https://unsplash.com/@haliewestphoto"
              target="_blank"
              rel="noopener noreferrer"
              >Halie West</a
            >
            from
            <a
              href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
              target="_blank"
              rel="noopener noreferrer"
              >Unsplash</a
            >
          </p>
        </div>
      </div>
      <div class="form-fill">
        <div class="text-area">
          <h1>Create your account</h1>
          <p>
            This is not a real online service!You know you eed something like
            this in your life to help you realize your deepest dreams.
          </p>
          <p><em>Sign up </em> now! to get started</p>
          <p>You <em> know </em> you want to.</p>
        </div>
        <div class="form-area">
          <form method="post" action="" id="sign-up-form">
            <h2 class="form-title">Lets Do this!</h2>

            <div class="form-row">
              <p class="input-container">
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" />
              </p>

              <p class="input-container">
                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" />
              </p>
            </div>

            <div class="form-row">
              <p class="input-container">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" />
              </p>

              <p class="input-container">
                <label for="phone-number">Phone Number:</label>
                <input
                  type="tel"
                  id="phone-number"
                  name="phone-number"
                  placeholder="+91-9XXX-XXX-XX"
                  pattern="^(?:\+[1-9]\d{0,3}[\s-]?)?0?\d{4,13}$"
                  title="Please enter a valid phone number!"
                />
              </p>
            </div>

            <div class="form-row">
              <p class="input-container">
                <label for="pwd">Password:</label>
                <input
                  type="password"
                  id="pwd"
                  name="password"
                  pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d#%+_]{8,}$"
                  required
                />
              </p>

              <p class="input-container">
                <label for="confirm-pwd">Confirm Password:</label>
                <input
                  type="password"
                  id="confirm-pwd"
                  name="confirm-pwd"
                  pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d#%+_]{8,}$"
                  required
                />
              </p>
            </div>
          </form>
        </div>
        <div class="footer-row">
          <button type="submit">Create Account</button>
          <p id="sign-in">Already have an account? <a href="#">Log in</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
